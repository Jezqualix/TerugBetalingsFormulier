<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DockX Rental — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="admin-page">
  <div x-data="adminApp()" x-init="init()">

    <header class="site-header">
      <div class="site-header-inner">
        <div class="logo">
          <span class="logo-dock">DOCK</span><span class="logo-x">X</span>
          <span class="logo-rental">RENTAL</span>
        </div>
        <div class="header-actions">
          <a class="btn-secondary" href="/">&larr; Formulier</a>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="admin-card" x-show="denied" x-cloak>
        <h1>Geen toegang</h1>
        <p style="color:var(--text-muted);">Je account heeft de Admin-rol niet. Vraag een beheerder om je de rol toe te wijzen.</p>
      </div>

      <template x-if="!denied">
      <div class="admin-card">

            <div class="admin-header-row">
              <h1>Aanvragen</h1>
              <div style="display:flex;gap:8px;">
                <button class="btn-secondary" @click="colPickerOpen = !colPickerOpen">Kolommen</button>
                <button class="btn-primary" @click="exportData('csv')">Export CSV</button>
                <button class="btn-primary" @click="exportData('xlsx')">Export XLSX</button>
              </div>
            </div>

            <!-- Column picker. Hides columns from the view only; the export keeps
                 every field, so switching one off never loses data. -->
            <div class="col-picker" x-show="colPickerOpen" x-cloak>
              <template x-for="c in columns" :key="c.key">
                <label class="col-picker-item">
                  <input type="checkbox" :checked="cols[c.key]" @change="toggleCol(c.key)">
                  <span x-text="c.label"></span>
                </label>
              </template>
              <button class="btn-link" @click="resetCols()">Standaard</button>
            </div>

            <!-- Filters -->
            <div class="filters-bar">
              <label>Van</label>
              <input type="date" x-model="filters.from" @change="page=1;loadSubmissions()">
              <label>Tot</label>
              <input type="date" x-model="filters.to" @change="page=1;loadSubmissions()">
              <select x-model="filters.status" @change="page=1;loadSubmissions()">
                <option value="">Alle statussen</option>
                <option value="nieuw">Nieuw</option>
                <option value="verwerkt">Verwerkt</option>
              </select>
            </div>

            <!-- Loading -->
            <p x-show="loading" style="color:var(--text-muted);font-size:13px;margin-bottom:12px;">Laden&hellip;</p>

            <!-- Table -->
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th x-show="cols.id">ID</th>
                    <th x-show="cols.created_at">Datum</th>
                    <th x-show="cols.naam_aanvrager">Naam aanvrager</th>
                    <th x-show="cols.email_aanvrager">E-mail</th>
                    <th x-show="cols.type_betaling">Type betaling</th>
                    <th x-show="cols.naam_terugstorting">Naam begunstigde</th>
                    <th x-show="cols.iban">IBAN</th>
                    <th x-show="cols.omschrijving">Omschrijving</th>
                    <th x-show="cols.status">Status</th>
                    <th x-show="cols.taal">Taal</th>
                    <th x-show="cols.uploads">Bijlagen</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="row in rows" :key="row.id">
                    <tr>
                      <td x-show="cols.id" x-text="row.id"></td>
                      <!-- Date only in the cell, full timestamp on hover -->
                      <td x-show="cols.created_at" :title="fmtDateTime(row.created_at)" x-text="fmtDate(row.created_at)"></td>
                      <td x-show="cols.naam_aanvrager" x-text="row.naam_aanvrager"></td>
                      <td x-show="cols.email_aanvrager" x-text="row.email_aanvrager"></td>
                      <td x-show="cols.type_betaling" x-text="row.type_betaling"></td>
                      <td x-show="cols.naam_terugstorting" x-text="row.naam_terugstorting"></td>
                      <td x-show="cols.iban" x-text="row.iban || '—'"></td>
                      <!-- Truncation is CSS (max-width + ellipsis), not a JS slice: it adapts to
                           the column width instead of cutting at a fixed 40 characters, and the
                           full text stays in the title. -->
                      <td class="col-omschrijving" x-show="cols.omschrijving" :title="row.omschrijving || ''" x-text="row.omschrijving || '—'"></td>
                      <td x-show="cols.status">
                        <select
                          class="status-select"
                          :class="row.status === 'nieuw' ? 'badge-nieuw' : 'badge-verwerkt'"
                          x-model="row.status"
                          @change="updateStatus(row)"
                        >
                          <option value="nieuw">nieuw</option>
                          <option value="verwerkt">verwerkt</option>
                        </select>
                      </td>
                      <td x-show="cols.taal" x-text="(row.taal || 'nl').toUpperCase()"></td>
                      <td x-show="cols.uploads">
                        <button
                          x-show="row.upload_count > 0"
                          class="btn-link"
                          @click="showUploads(row)"
                          x-text="`📎 ${row.upload_count}`"
                        ></button>
                        <span x-show="!row.upload_count">—</span>
                      </td>
                    </tr>
                  </template>
                  <tr x-show="!loading && rows.length === 0">
                    <td :colspan="visibleColCount" style="text-align:center;color:var(--text-muted);padding:32px;">
                      Geen aanvragen gevonden
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Uploads panel -->
            <div class="uploads-panel" x-show="uploadsFor" x-cloak>
              <div class="uploads-panel-header">
                <strong x-text="uploadsFor ? `Bijlagen — aanvraag #${uploadsFor.id} (${uploadsFor.naam_aanvrager})` : ''"></strong>
                <button class="btn-secondary" @click="closeUploads()">Sluiten</button>
              </div>
              <p x-show="uploadsLoading" style="color:var(--text-muted);font-size:13px;">Laden&hellip;</p>
              <ul class="uploads-list" x-show="!uploadsLoading">
                <template x-for="u in uploads" :key="u.id">
                  <li>
                    <button class="btn-link" @click="downloadUpload(u)" x-text="u.original_name"></button>
                    <span style="color:var(--text-muted);font-size:12px;" x-text="fmtSize(u.size_bytes)"></span>
                  </li>
                </template>
                <li x-show="!uploadsLoading && uploads.length === 0" style="color:var(--text-muted);">Geen bijlagen gevonden</li>
              </ul>
            </div>

            <!-- Pagination -->
            <div class="pagination" x-show="total > pageSize">
              <button @click="prevPage()" :disabled="page <= 1">&larr; Vorige</button>
              <span x-text="`Pagina ${page} van ${Math.ceil(total / pageSize) || 1} (${total} resultaten)`"></span>
              <button @click="nextPage()" :disabled="page >= Math.ceil(total / pageSize)">Volgende &rarr;</button>
            </div>

      </div><!-- /.admin-card -->
      </template>
    </div><!-- /.page-content -->

  </div><!-- /x-data -->

  <script src="/assets/admin.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</body>
</html>
